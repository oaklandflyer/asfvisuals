name: Deploy to GitHub Pages (static)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Optional: keep your custom domain active after each deploy
      # - name: Ensure CNAME
      #   run: echo "asfvisualsllc.com" > ./CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # deploy the repository root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
