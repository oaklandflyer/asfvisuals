<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – ASF Visuals LLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Browse albums by country and city from ASF Visuals LLC." />
  <link rel="canonical" href="https://www.asfvisualsllc.com/gallery.html" />
  <meta property="og:title" content="Portfolio – ASF Visuals LLC" />
  <meta property="og:description" content="Curated albums by country and city." />
  <meta property="og:image" content="https://www.asfvisualsllc.com/images/social-preview.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#10437a" />
  <link rel="icon" href="images/ASF Logo.png" type="image/png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Fancybox (lightbox) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css" />

  <style>
    :root{
      --primary:#10437a; --accent:#e8bc56; --ink:#172135; --bg:#fafbfc;
      --panel:rgba(255,255,255,.92); --shadow:0 10px 40px rgba(0,0,0,.08);
      --radius:18px;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:'Montserrat',Arial,sans-serif;background:var(--bg);color:var(--ink)}
    img{max-width:100%;display:block}
    a{text-decoration:none;color:inherit}

    /* Header (matches site) */
    .site-header{position:fixed;inset-inline:0;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,64px);background:rgba(255,255,255,.85);backdrop-filter:saturate(140%) blur(10px);box-shadow:0 1px 12px rgba(16,67,122,.06);transition:transform .32s ease}
    .logo-link img{height:60px;width:auto;object-fit:contain}
    .site-nav ul{list-style:none;display:flex;gap:clamp(10px,2vw,28px);margin:0;padding:0}
    .site-nav a{font-weight:600;padding:8px 14px;border-radius:999px;color:var(--primary);transition:background .2s,color .2s}
    .site-nav a:hover,.site-nav a.active,.site-nav a[aria-current="page"]{background:var(--accent);color:#111}
    .menu-toggle{display:none;width:44px;height:44px;border:none;background:none;cursor:pointer}
    .menu-toggle .bar{display:block;width:26px;height:3px;margin:5px auto;background:var(--primary);border-radius:2px;transition:.3s}
    .menu-toggle.open .bar:nth-child(1){transform:translateY(8px) rotate(45deg)}
    .menu-toggle.open .bar:nth-child(2){opacity:0}
    .menu-toggle.open .bar:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
    @media (max-width:860px){
      .menu-toggle{display:block}
      .site-nav{position:fixed;right:0;top:74px;width:min(68vw,360px);height:calc(100dvh - 74px);background:#fff;transform:translateX(100%);transition:transform .24s cubic-bezier(.4,2.2,.3,1);box-shadow:-2px 0 18px rgba(0,0,0,.08)}
      .site-nav.open{transform:translateX(0)}
      .site-nav ul{flex-direction:column;padding:26px;gap:12px}
      body.no-scroll{overflow:hidden}
    }

    /* Page header */
    .page-hero{margin-top:80px;padding:28px clamp(16px,4vw,48px) 12px}
    .page-hero h1{font-family:'Playfair Display',serif;font-weight:700;color:var(--primary);font-size:clamp(1.9rem,4vw,2.6rem);margin:0}
    .page-hero p{margin:6px 0 0;color:#2a3a55}

    /* Breadcrumbs + Back */
    .controls{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px clamp(16px,4vw,48px)}
    .breadcrumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600;color:#2a3a55}
    .breadcrumbs a{color:var(--primary)}
    .crumb-sep{opacity:.5}
    .back-btn{display:none;margin-left:clamp(16px,4vw,48px);margin-bottom:6px;align-items:center;gap:8px;background:#fff;border:1px solid #dce6f3;border-radius:999px;padding:9px 14px;font-weight:700;color:var(--primary);box-shadow:0 1px 8px rgba(0,0,0,.06)}
    .back-btn:hover{background:var(--accent);color:#111;border-color:transparent}

    /* Tiles */
    .grid{display:grid;gap:10px;margin:0 clamp(16px,4vw,48px) 28px}
    .grid.countries{grid-template-columns:repeat(6,1fr)}
    .grid.cities{grid-template-columns:repeat(6,1fr)}
    .grid.photos{grid-template-columns:repeat(6,1fr)}
    @media (max-width:1200px){.grid.countries,.grid.cities,.grid.photos{grid-template-columns:repeat(4,1fr)}}
    @media (max-width:700px){.grid.countries,.grid.cities,.grid.photos{grid-template-columns:repeat(2,1fr)}}

    .card{position:relative;border-radius:14px;overflow:hidden;background:#e9eef5;aspect-ratio:4/3;box-shadow:0 3px 14px rgba(0,0,0,.06);cursor:pointer;isolation:isolate}
    .card img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease, opacity .35s ease;opacity:0}
    .card img.loaded{opacity:1}
    .card:hover img{transform:scale(1.03)}
    .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.0),rgba(0,0,0,.55))}
    .meta{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:end;color:#fff;z-index:1}
    .title{font-weight:800;letter-spacing:.02em;text-shadow:0 2px 8px rgba(0,0,0,.4)}
    .count{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 10px;font-size:.9rem;font-weight:700}

    /* Photo tile (click -> lightbox) */
    .photo{position:relative;border-radius:12px;overflow:hidden;background:#e9eef5;aspect-ratio:4/3}
    .photo img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease,transform .25s ease}
    .photo img.loaded{opacity:1}
    .photo:hover img{transform:scale(1.02)}

    /* Footer */
    .site-footer{background:#10233a;color:#f5f5f5;padding:36px clamp(16px,4vw,48px) 28px;border-radius:var(--radius) var(--radius) 0 0;margin-top:42px;text-align:center}
    .social{display:flex;gap:14px;justify-content:center;margin-top:10px}
    .social img{width:28px;height:28px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 1px 8px rgba(0,0,0,.08)}
  </style>
</head>
<body>
  <a class="skip-link" href="#main" style="position:absolute;left:-999px;top:auto;width:1px;height:1px;overflow:hidden;">Skip to main content</a>

  <header class="site-header" id="header">
    <a href="index.html" class="logo-link" aria-label="ASF Visuals home">
      <img src="images/TransparentLogo.png" alt="ASF Visuals Logo" width="200" height="60" loading="eager" />
    </a>
    <nav id="navbar" class="site-nav" aria-label="Main Navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html" class="active">Portfolio</a></li>
        <li><a href="real-estate.html">Real Estate</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button id="menuToggle" class="menu-toggle" aria-label="Toggle navigation" aria-controls="navbar" aria-expanded="false">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
  </header>

  <main id="main">
    <section class="page-hero">
      <h1>Portfolio</h1>
      <p>Explore albums by country, then city — and open any image in a lightbox.</p>
    </section>

    <div class="controls">
      <nav class="breadcrumbs" aria-label="Breadcrumbs" id="breadcrumbs"></nav>
    </div>

    <button class="back-btn" id="backBtn">◀ Back</button>

    <section id="countriesView" class="grid countries" aria-label="Countries"></section>
    <section id="citiesView" class="grid cities" aria-label="Cities" style="display:none;"></section>
    <section id="photosView" class="grid photos" aria-label="Photos" style="display:none;"></section>
  </main>

  <footer class="site-footer">
    <div class="social">
      <a href="https://www.linkedin.com/company/asfvisualsllc/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <img src="images/linkedin-icon.png" alt="LinkedIn" width="28" height="28" loading="lazy" />
      </a>
      <a href="https://www.instagram.com/asfvisuals/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="images/instagram-icon.png" alt="Instagram" width="28" height="28" loading="lazy" />
      </a>
    </div>
    <p style="opacity:.85">© 2025 ASF Visuals LLC. All rights reserved.</p>
  </footer>

  <!-- Fancybox JS -->
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>

  <script>
    // ---------- Mobile nav + header behavior ----------
    (function navInit(){
      const menuBtn = document.getElementById('menuToggle');
      const nav = document.getElementById('navbar');
      if (menuBtn && nav) {
        menuBtn.addEventListener('click', () => {
          const open = nav.classList.toggle('open');
          menuBtn.classList.toggle('open');
          menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (window.innerWidth <= 860) document.body.classList.toggle('no-scroll', open);
        });
        nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
          if (window.innerWidth <= 860) { nav.classList.remove('open'); menuBtn.classList.remove('open'); document.body.classList.remove('no-scroll'); menuBtn.setAttribute('aria-expanded','false'); }
        }));
      }
      // Hide on scroll
      let lastY = window.scrollY; const header = document.getElementById('header');
      window.addEventListener('scroll', () => {
        const y = window.scrollY; header.style.transform = (y > lastY && y > 120) ? 'translateY(-100%)' : 'translateY(0)'; lastY = y;
      }, { passive: true });

      // Mark active link
      (function setActiveNav(){
        const page = 'gallery.html';
        document.querySelectorAll('.site-nav a[href]').forEach(a=>{
          const href = a.getAttribute('href').split('#')[0].split('?')[0];
          const match = href === page;
          a.classList.toggle('active', match);
          if (match) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
        });
      })();
    })();

    // ---------- Data loading ----------
    const MANIFEST_PATH = '/gallery/imagePaths.json';

    async function loadManifest(){
      try {
        const res = await fetch(MANIFEST_PATH, { cache: 'no-cache' });
        if (!res.ok) throw new Error('manifest not found');
        return await res.json();
      } catch (e) {
        console.error('Failed to load imagePaths.json', e);
        return null;
      }
    }

    // Helpers to derive Country & City from file path
    function splitPath(p){
      const clean = p.replaceAll('\\','/');         // normalize
      const parts = clean.split('/');               // e.g., ["gallery","UK","England","London","BigBen-3_1600.jpg"]
      const gi = parts.indexOf('gallery');
      const segs = gi >= 0 ? parts.slice(gi + 1) : parts; // ["UK","England","London","BigBen-3_1600.jpg"]
      const country = segs[0] || 'Unknown';
      const city = segs.length >= 3 ? segs[segs.length - 2] : (segs[1] || 'Unknown'); // ignore middle region if present
      return { country, city };
    }

    function stripSuffixToStem(fp){
      // remove _480/_960/_1600.extension OR plain extension to get a base
      return fp
        .replace(/_(480|960|1600)\.(avif|jpg)$/i,'')
        .replace(/\.(jpg|jpeg|png|webp|avif)$/i,'');
    }

    function encodeSegments(path){
      return path.split('/').map(encodeURIComponent).join('/');
    }

    function buildSources(stem){
      const safe = encodeSegments(stem);
      return {
        avif: `${safe}_480.avif 480w, ${safe}_960.avif 960w, ${safe}_1600.avif 1600w`,
        jpg: `${safe}_1600.jpg`,
        thumb: `${safe}_960.avif`
      };
    }

    // Flexible manifest parsing (supports {files:[]} or {categories:{}} forms)
    function manifestItems(m){
      if (!m) return [];
      if (Array.isArray(m.files)) return m.files;   // preferred
      if (m.categories){
        const arr = [];
        Object.values(m.categories).forEach(list => arr.push(...list));
        return arr;
      }
      return [];
    }

    function toHierarchy(manifest){
      const items = manifestItems(manifest);
      const map = new Map(); // country -> { title, cover, cities: Map(city -> {title, cover, photos:[]}) }

      items.forEach(it => {
        const anyPath = it.jpg1600 || it.avif1600 || it.path || it.stem || '';
        if (!anyPath) return;
        const stem = it.stem || stripSuffixToStem(anyPath);
        const { country, city } = splitPath(anyPath);

        const cKey = country;
        const cityKey = city;

        if (!map.has(cKey)) map.set(cKey, { title: country, cover: null, cities: new Map() });
        const countryObj = map.get(cKey);

        if (!countryObj.cities.has(cityKey)) countryObj.cities.set(cityKey, { title: city, cover: null, photos: [] });
        const cityObj = countryObj.cities.get(cityKey);

        const srcs = buildSources(stem);
        const photo = {
          title: it.alt || city,
          thumb: srcs.thumb,
          avif: srcs.avif,
          jpg: srcs.jpg
        };
        cityObj.photos.push(photo);
        if (!cityObj.cover) cityObj.cover = photo.thumb;
        if (!countryObj.cover) countryObj.cover = photo.thumb;
      });

      // Sort countries/cities A→Z
      const countries = Array.from(map.values()).sort((a,b)=>a.title.localeCompare(b.title));
      countries.forEach(c => {
        c.cities = Array.from(c.cities.values()).sort((a,b)=>a.title.localeCompare(b.title));
      });
      return countries;
    }

    // ---------- Router ( #/Country/City ) ----------
    function getPath(){
      const hash = decodeURI(location.hash || '#/');
      return hash.replace(/^#\//,'').split('/').filter(Boolean); // [Country, City?]
    }
    function setPath(parts){ location.hash = '#/' + parts.map(encodeURI).join('/'); }

    // ---------- DOM ----------
    const crumbs = document.getElementById('breadcrumbs');
    const backBtn = document.getElementById('backBtn');
    const viewCountries = document.getElementById('countriesView');
    const viewCities = document.getElementById('citiesView');
    const viewPhotos = document.getElementById('photosView');

    function lazyImg(img){
      const io = new IntersectionObserver((entries, obs)=>{
        entries.forEach(e=>{
          if (!e.isIntersecting) return;
          const el = e.target;
          const src = el.getAttribute('data-src');
          if (src) {
            el.src = src;
            el.onload = () => el.classList.add('loaded');
          }
          obs.unobserve(el);
        });
      }, { threshold:.15 });
      io.observe(img);
    }

    function buildCrumbs(parts){
      const frag = document.createDocumentFragment();
      const link = (label, toParts) => {
        const a = document.createElement('a');
        a.href = '#/' + toParts.map(encodeURI).join('/');
        a.textContent = label;
        a.addEventListener('click', e => { e.preventDefault(); setPath(toParts); });
        return a;
      };
      frag.appendChild(link('Countries', []));
      if (parts[0]) { frag.appendChild(Object.assign(document.createElement('span'), {textContent:'›', className:'crumb-sep', style:'margin:0 6px'})); frag.appendChild(link(parts[0], [parts[0]])); }
      if (parts[1]) { frag.appendChild(Object.assign(document.createElement('span'), {textContent:'›', className:'crumb-sep', style:'margin:0 6px'})); frag.appendChild(link(parts[1], [parts[0], parts[1]])); }
      crumbs.innerHTML = ''; crumbs.appendChild(frag);
    }

    function show(view){
      viewCountries.style.display = (view==='countries') ? 'grid' : 'none';
      viewCities.style.display    = (view==='cities')    ? 'grid' : 'none';
      viewPhotos.style.display    = (view==='photos')    ? 'grid' : 'none';
      backBtn.style.display = (view!=='countries') ? 'inline-flex' : 'none';
    }

    let DATA = []; // [{title, cover, cities:[{title, cover, photos:[]}, ...]}]

    function render(){
      const parts = getPath();
      buildCrumbs(parts);

      if (!parts.length){
        // Countries
        show('countries');
        viewCountries.innerHTML = '';
        DATA.forEach(country=>{
          const card = document.createElement('a');
          card.className = 'card';
          card.href = '#';
          const img = document.createElement('img');
          img.alt = country.title;
          img.setAttribute('data-src', country.cover || 'images/social-preview.jpg');
          lazyImg(img);
          const overlay = Object.assign(document.createElement('span'), {className:'overlay'});
          const meta = Object.assign(document.createElement('div'), {className:'meta'});
          const t = Object.assign(document.createElement('div'), {className:'title', textContent: country.title});
          const count = Object.assign(document.createElement('div'), {className:'count', textContent: `${country.cities.length} cities`});
          meta.append(t, count); card.append(img, overlay, meta);
          card.addEventListener('click', e=>{ e.preventDefault(); setPath([country.title]); });
          viewCountries.appendChild(card);
        });
        return;
      }

      const country = DATA.find(c => c.title.toLowerCase() === parts[0].toLowerCase());
      if (!country){
        setPath([]); return;
      }

      if (parts.length === 1){
        // Cities
        show('cities');
        viewCities.innerHTML = '';
        country.cities.forEach(city=>{
          const card = document.createElement('a');
          card.className='card'; card.href='#';
          const img = document.createElement('img');
          img.alt = city.title;
          img.setAttribute('data-src', city.cover || 'images/social-preview.jpg');
          lazyImg(img);
          const overlay = Object.assign(document.createElement('span'), {className:'overlay'});
          const meta = Object.assign(document.createElement('div'), {className:'meta'});
          const t = Object.assign(document.createElement('div'), {className:'title', textContent: city.title});
          const count = Object.assign(document.createElement('div'), {className:'count', textContent: `${city.photos.length} photos`});
          meta.append(t, count); card.append(img, overlay, meta);
          card.addEventListener('click', e=>{ e.preventDefault(); setPath([country.title, city.title]); });
          viewCities.appendChild(card);
        });
        return;
      }

      // Photos
      const city = country.cities.find(ct => ct.title.toLowerCase() === parts[1].toLowerCase());
      if (!city){
        setPath([country.title]); return;
      }
      show('photos');
      viewPhotos.innerHTML = '';
      city.photos.forEach(p=>{
        const a = document.createElement('a');
        a.href = p.jpg; // open largest JPG in lightbox
        a.setAttribute('data-fancybox', `${country.title} – ${city.title}`);
        a.setAttribute('data-caption', `${city.title}`);

        const tile = document.createElement('div'); tile.className='photo';
        const pic = document.createElement('picture');

        const srcAvif = document.createElement('source');
        srcAvif.type = 'image/avif';
        srcAvif.setAttribute('data-srcset', p.avif);
        pic.appendChild(srcAvif);

        const img = document.createElement('img');
        img.alt = p.title || 'Photo';
        img.setAttribute('data-src', p.thumb || p.jpg);
        lazyImg(img);

        pic.appendChild(img);
        tile.appendChild(pic);
        a.appendChild(tile);
        viewPhotos.appendChild(a);

        // activate avif srcset lazily
        const obs = new IntersectionObserver((entries, o)=>{
          entries.forEach(entry=>{
            if (!entry.isIntersecting) return;
            srcAvif.srcset = srcAvif.getAttribute('data-srcset');
            o.unobserve(entry.target);
          });
        }, { threshold:.15 });
        obs.observe(pic);
      });
    }

    // Back button
    document.getElementById('backBtn').addEventListener('click', () => {
      const parts = getPath();
      parts.pop();
      setPath(parts);
    });

    // ---------- Boot ----------
    (async function init(){
      const manifest = await loadManifest();
      DATA = toHierarchy(manifest || {});
      render();
      window.addEventListener('hashchange', render);
    })();
  </script>
</body>
</html>
