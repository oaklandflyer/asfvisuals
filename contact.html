<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – ASF Visuals LLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact ASF Visuals LLC to book a shoot, inquire about services, or ask a question." />
  <meta name="keywords" content="contact, photography, Pittsburgh, drone, booking" />
  <link rel="canonical" href="https://www.asfvisualsllc.com/contact.html" />
  <meta property="og:title" content="Contact – ASF Visuals LLC" />
  <meta property="og:description" content="Book a shoot or ask a question. We’d love to hear from you." />
  <meta property="og:image" content="https://www.asfvisualsllc.com/images/social-preview.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#10437a" />

  <!-- Favicon + Fonts -->
  <link rel="icon" href="images/ASF Logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VBF13JPLGF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VBF13JPLGF');
  </script>

  <style>
    :root {
      --primary: #10437a;
      --accent: #e8bc56;
      --bg: #fafbfc;
      --card-bg: rgba(255,255,255,0.96);
      --shadow: 0 8px 32px rgba(0,0,0,0.08);
      --radius: 18px;
      --ink: #172135;
      --cta: #10437a;
      --cta-hover: #e8bc56;
      --container: 780px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: 'Montserrat', Arial, sans-serif; background: var(--bg); color: var(--ink); }
    a { color: inherit; text-decoration: none; }

    /* Header (match site) */
    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 5vw; background: rgba(255,255,255,0.94);
      box-shadow: 0 2px 8px rgba(16,67,122,0.06);
      transition: top 0.32s cubic-bezier(.37,1.15,.43,0.96);
    }
    .logo-link img { height: 62px; width: auto; max-width: 180px; object-fit: contain; display: block; }
    .site-nav ul { list-style: none; display: flex; gap: 2vw; margin: 0; padding: 0; }
    .site-nav a {
      color: var(--primary); font-weight: 600; letter-spacing: .01em;
      padding: 6px 14px; border-radius: var(--radius); transition: background .2s, color .2s;
    }
    .site-nav a:hover, .site-nav a.active, .site-nav a[aria-current="page"] { background: var(--accent); color: #111; }

    .menu-toggle { display: none; width: 44px; height: 44px; border: none; background: none; cursor: pointer; z-index: 150; }
    .menu-toggle .bar { width: 28px; height: 4px; margin: 4px auto; background: var(--primary); border-radius: 2px; transition: .3s; display: block; }
    .menu-toggle.open .bar:nth-child(1){ transform: translateY(8px) rotate(45deg); }
    .menu-toggle.open .bar:nth-child(2){ opacity: 0; }
    .menu-toggle.open .bar:nth-child(3){ transform: translateY(-8px) rotate(-45deg); }

    @media (max-width: 800px) {
      .menu-toggle { display: flex; }
      .site-nav {
        position: fixed; top: 70px; right: 0; width: min(68vw, 360px); height: 100dvh;
        background: #fff; box-shadow: -2px 0 16px #0002; transform: translateX(100%);
        transition: transform .25s cubic-bezier(.4,2.2,.3,1); z-index: 101; padding: 38px 0 0;
      }
      .site-nav.open { transform: translateX(0); }
      .site-nav ul { flex-direction: column; gap: 12px; padding-left: 32px; }
      body.no-scroll { overflow: hidden; }
    }

    /* Page intro */
    .page-hero {
      margin-top: 82px; padding: 36px 5vw 10px;
    }
    .page-hero h1 {
      font-family: 'Playfair Display', serif; font-weight: 700; color: var(--primary);
      font-size: clamp(1.9rem, 4vw, 2.4rem); margin: 0 0 8px;
    }
    .page-hero p { margin: 0; color: #2a3a55; max-width: 900px; }

    /* Contact card */
    .contact-main {
      max-width: var(--container); margin: 18px auto 40px; padding: 0 5vw;
    }
    .contact-card {
      background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 26px 22px;
    }
    .contact-title {
      text-align: center; font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--primary);
      margin: 0 0 12px;
    }
    .contact-form { display: grid; gap: 16px; }
    .field { display: grid; gap: 8px; }
    label { font-weight: 600; color: var(--primary); }
    input, textarea {
      padding: 0.9rem 1rem; border-radius: 10px; border: 1.5px solid #d5e4f3;
      font: inherit; background: #f8fafc; color: var(--ink); outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { min-height: 120px; max-height: 340px; resize: vertical; }

    .btn {
      display: inline-block; background: var(--cta); color: #fff; font-weight: 700;
      padding: 11px 28px; border-radius: var(--radius); border: 0; cursor: pointer;
      box-shadow: var(--shadow); letter-spacing: .02em; transition: background .2s, color .2s;
    }
    .btn:hover, .btn:focus { background: var(--cta-hover); color: #111; }

    .contact-info { margin-top: 18px; text-align: center; color: #333; }
    .contact-info a { color: var(--primary); font-weight: 700; }
    .status { margin-top: 12px; font-size: .98rem; }
    .status[hidden] { display: none; }
    .status.ok { color: #106c3a; }
    .status.err { color: #a11212; }

    /* Footer */
    .site-footer { background: #10233a; color: #f5f5f5; text-align: center; padding: 40px 6vw 28px; border-radius: var(--radius) var(--radius) 0 0; }
    .social-links { display: flex; gap: 16px; justify-content: center; margin-top: 16px; }
    .social-links img { width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 8px #0001; padding: 2px; }

    /* Motion reduce */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }

    /* Skip link */
    .skip-link {
      position: absolute; left: -999px; top: auto; width: 1px; height: 1px; overflow: hidden; z-index: 101;
      background: #fff; color: #103047; border-radius: 0 0 10px 10px; padding: 8px 22px;
    }
    .skip-link:focus { left: 12px; top: 6px; width: auto; height: auto; }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <a href="index.html" class="logo-link" aria-label="ASF Visuals home">
      <div id="logo-anim" aria-hidden="true"></div>
      <img id="logo-fallback" src="images/TransparentLogo.png" alt="ASF Visuals Logo" loading="lazy">
    </a>
    <button id="menu-toggle" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="menu-toggle">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>

    <nav id="navbar" class="site-nav" aria-label="Main Navigation">
        <ul>
          <li><a href="index.html#top">Home</a></li>
          <li><a href="index.html#portfolio">Portfolio</a></li>
          <li><a href="real-estate.html">Real Estate</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
        </ul>
    </nav>
  </header>

  <main id="main" class="contact-main">
    <section class="contact-card" role="region" aria-label="Contact form">
      <h1 class="contact-title">Let’s Connect</h1>

      <!-- Formspree AJAX (with graceful fallback) -->
      <form id="contact-form" class="contact-form" action="https://formspree.io/f/xovvrygq" method="POST" novalidate>
        <div class="field">
          <label for="name">Your Name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Name" required />
        </div>

        <div class="field">
          <label for="email">Your Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="Email" required />
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="How can I help?" required></textarea>
        </div>

        <!-- Optional: subject line in Formspree emails -->
        <input type="hidden" name="_subject" value="New message from ASF Visuals contact form" />
        <!-- Honeypot (spam trap) -->
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute;left:-5000px;opacity:0;" aria-hidden="true" />

        <button class="btn" type="submit">Send Message</button>
        <p id="form-status" class="status" role="status" aria-live="polite" hidden></p>
      </form>

      <div class="contact-info">
        <div>Email: <a href="mailto:andrew@asfvisualsllc.com">andrew@asfvisualsllc.com</a></div>
        <div>Instagram: <a href="https://www.instagram.com/asfvisuals/" target="_blank" rel="noopener noreferrer">@asfvisuals</a></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ASF Visuals LLC. All rights reserved.</p>
    <div class="social-links">
      <a href="https://www.linkedin.com/company/asfvisualsllc/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <img src="images/linkedin-icon.png" alt="LinkedIn" width="24" height="24" loading="lazy" decoding="async" />
      </a>
      <a href="https://www.instagram.com/asfvisuals/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <img src="images/instagram-icon.png" alt="Instagram" width="24" height="24" loading="lazy" decoding="async" />
      </a>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Mobile nav + body scroll lock
      const toggle = document.getElementById('menu-toggle');
      const nav = document.getElementById('navbar');
      const body = document.body;

      if (toggle && nav) {
        toggle.addEventListener('click', function () {
          const open = nav.classList.toggle('open');
          this.classList.toggle('open');
          this.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (window.innerWidth <= 800) body.classList.toggle('no-scroll', open);
        });
        nav.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            if (window.innerWidth <= 800) {
              nav.classList.remove('open');
              toggle.classList.remove('open');
              toggle.setAttribute('aria-expanded','false');
              body.classList.remove('no-scroll');
            }
          });
        });
      }

      // Header hide on scroll
      let lastY = window.scrollY;
      const header = document.getElementById('site-header');
      let ticking = false;
      function onScroll() {
        if (!ticking) {
          window.requestAnimationFrame(function () {
            header.style.top = (window.scrollY > lastY && window.scrollY > 120) ? '-90px' : '0';
            lastY = window.scrollY;
            ticking = false;
          });
          ticking = true;
        }
      }
      window.addEventListener('scroll', onScroll, { passive: true });

      // AJAX form submit (Formspree)
      const form = document.getElementById('contact-form');
      const statusEl = document.getElementById('form-status');

      form.addEventListener('submit', async (e) => {
        // basic client validation
        if (!form.checkValidity()) {
          // Let browser show native validation tooltips
          return;
        }
        e.preventDefault();

        statusEl.hidden = false;
        statusEl.className = 'status';
        statusEl.textContent = 'Sending...';

        try {
          const formData = new FormData(form);
          const res = await fetch(form.action, {
            method: 'POST',
            headers: { 'Accept': 'application/json' },
            body: formData
          });

          if (res.ok) {
            statusEl.classList.add('ok');
            statusEl.textContent = 'Thanks! Your message has been sent.';
            form.reset();
          } else {
            // If Formspree returns an error JSON
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || 'Submission failed. Please try again.');
          }
        } catch (err) {
          statusEl.classList.add('err');
          statusEl.textContent = err.message || 'Something went wrong. Please try again or email us directly.';
          // Fallback to regular POST if desired:
          // form.submit();
        }
      });
    });
  </script>
</body>
</html>
