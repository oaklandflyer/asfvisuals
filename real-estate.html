  <style>
    /* --- Root Variables --- */
    :root {
      --primary: #10437a;
      --accent: #e8bc56;
      --bg: #fafbfc;
      --card-bg: rgba(255,255,255,0.96);
      --shadow: 0 8px 32px rgba(0,0,0,0.08);
      --radius: 18px;
      --cta: #10437a;
      --cta-hover: #e8bc56;
    }

    /* --- Base Styles --- */
    html, body {
      margin: 0; padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      background: var(--bg);
      color: #172135;
      scroll-behavior: smooth;
    }
    .hidden { display: none !important; }

    /* --- Header --- */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 5vw;
      background: rgba(255,255,255,0.94);
      box-shadow: 0 2px 8px rgba(16,67,122,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-link img {
      height: 62px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      display: block;
    }
    /* Animated logo container */
    #logo-anim { height: 62px; display: block; }
    #logo-anim svg { height: 62px; width: auto; display: block; }
    /* Stroke-draw phase: show strokes, hide fills */
    #logo-anim svg.stroke-phase * {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .draw-in { animation: draw 1.6s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    /* Smoothly reveal original fills when stroke phase ends */
    #logo-anim svg.final-fill * { transition: fill .6s ease, stroke .6s ease; }

    .site-nav ul {
      display: flex;
      gap: 2vw;
      list-style: none;
      margin: 0; padding: 0;
    }
    .site-nav a {
      font-weight: 600;
      text-decoration: none;
      color: var(--primary);
      letter-spacing: 0.01em;
      padding: 6px 14px;
      border-radius: var(--radius);
      transition: background 0.2s, color 0.2s;
    }
    .site-nav a.active,
    .site-nav a:hover {
      background: var(--accent);
      color: #111;
    }

    /* --- Buttons --- */
    .btn {
      background: var(--cta);
      color: #fff;
      font-weight: 700;
      padding: 11px 28px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow);
      font-size: 1rem;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .btn:hover,
    .btn:focus {
      background: var(--cta-hover);
      color: #111;
    }

    /* --- Mobile Nav --- */
    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 44px;
      height: 44px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 150;
    }
    .menu-toggle .bar {
      width: 28px;
      height: 4px;
      margin: 4px 0;
      background: var(--primary);
      border-radius: 2px;
      transition: 0.3s;
    }
    .menu-toggle.open .bar:nth-child(1) { transform: translateY(8px) rotate(45deg);}
    .menu-toggle.open .bar:nth-child(2) { opacity: 0;}
    .menu-toggle.open .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg);}
    @media (max-width: 800px) {
      .menu-toggle { display: flex; }
      .site-nav {
        position: fixed;
        top: 70px;
        right: 0;
        background: #fff;
        box-shadow: -2px 0 16px #0002;
        width: 65vw;
        max-width: 340px;
        height: 100vh;
        transform: translateX(100%);
        transition: transform 0.25s cubic-bezier(.4,2.2,.3,1);
        z-index: 101;
        display: block;
        padding: 38px 0 0 0;
      }
      .site-nav.open { transform: translateX(0); }
      .site-nav ul {
        flex-direction: column;
        gap: 12px;
        padding-left: 32px;
      }
    }

    /* --- Hero --- */
    .hero {
      position: relative;
      min-height: 46vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg,rgba(16,67,122,0.24) 0%,rgba(232,188,86,0.10) 80%), url('images/DJI_0441.JPG') center/cover no-repeat;
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
    }
    .hero-text {
      background: rgba(255,255,255,0.89);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 38px;
      max-width: 430px;
      text-align: center;
    }
    .hero-text h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.35rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* --- Real Estate Section --- */
    .real-estate {
      max-width: 1150px;
      margin: 58px auto 0 auto;
      padding: 0 5vw;
    }
    .real-estate h2 {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 30px;
    }
    .filter-controls {
      text-align: center;
      margin-bottom: 28px;
    }
    .filter-controls .btn {
      margin: 0 6px 14px 0;
      padding: 10px 22px;
      font-size: 1.05rem;
      background: var(--bg);
      color: var(--cta);
      border: 2px solid var(--cta);
      box-shadow: none;
    }
    .filter-controls .btn.active,
    .filter-controls .btn:hover {
      background: var(--accent);
      color: #111;
      border-color: var(--accent);
    }
    .property-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(295px, 1fr));
      gap: 36px;
    }
    .property-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: box-shadow 0.25s, transform 0.19s;
    }
    .property-card:hover {
      box-shadow: 0 8px 32px rgba(16,67,122,0.17);
      transform: translateY(-4px) scale(1.03);
    }
    .image-wrapper {
      width: 100%;
      max-width: 295px;
      height: 170px;
      overflow: hidden;
      border-radius: 11px;
      margin-bottom: 16px;
      position: relative;
    }
    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 11px;
    }
    .price-badge {
      position: absolute;
      bottom: 13px;
      right: 13px;
      background: var(--primary);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 6px 17px;
      border-radius: 12px;
    }

    /* --- Footer --- */
    .site-footer {
      background: #10233a;
      color: #f5f5f5;
      padding: 48px 6vw 36px 6vw;
      border-radius: var(--radius) var(--radius) 0 0;
      margin-top: 80px;
      text-align: center;
    }
    .social-links {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 16px;
    }
    .social-links img {
      width: 28px;
      height: 28px;
      background: #fff;
      border-radius: 50%;
      padding: 2px;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Mobile menu
      const toggle = document.getElementById("menu-toggle");
      const nav = document.getElementById("navbar");
      toggle.addEventListener("click", function() {
        const open = nav.classList.toggle("open");
        this.classList.toggle("open");
        this.setAttribute("aria-expanded", open ? "true" : "false");
      });

      // Filter
      document.querySelectorAll('.filter-controls .btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-controls .btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const filter = this.dataset.filter;
          document.querySelectorAll('.property-card').forEach(card => {
            card.style.display = (filter === 'all' || card.dataset.type === filter) ? '' : 'none';
          });
        });
      });
    });

    // Animated logo (fetches images/ASFLogo.svg and draws it)
    (async function animateLogo(){
      const container = document.getElementById('logo-anim');
      const fallback = document.getElementById('logo-fallback');
      if (!container) return;

      try {
        const res = await fetch('images/ASFLogo.svg', { cache: 'no-cache' });
        if (!res.ok) throw new Error('SVG not found');
        const svgText = await res.text();
        container.innerHTML = svgText;

        const svg = container.querySelector('svg');
        if (!svg) throw new Error('SVG malformed');

        // Prepare for stroke-draw phase
        svg.classList.add('stroke-phase', 'final-fill');

        const targets = svg.querySelectorAll('path, line, polyline, polygon, circle, rect');
        targets.forEach((el, i) => {
          let len = 300;
          try { if (typeof el.getTotalLength === 'function') len = el.getTotalLength(); } catch(e){}
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
          el.style.animationDelay = (i * 70) + 'ms';
          el.classList.add('draw-in');
        });

        // Hide fallback static image when SVG is ready
        if (fallback) fallback.classList.add('hidden');

        // After draw completes, reveal original fills (remove stroke-phase)
        const totalTime = (targets.length * 70) + 1600; // ms
        setTimeout(() => {
          svg.classList.remove('stroke-phase');
          // Optional: also remove strokes entirely for a clean filled look
          targets.forEach(el => { el.style.stroke = 'none'; el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; });
        }, totalTime);
      } catch (e) {
        // If SVG not available, just keep the PNG
        console.warn('Logo animation fallback:', e);
      }
    })();
  </script>
