<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Real Estate Portfolio - ASF Visuals LLC</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css"/>

  <style>
    :root{--primary:#10437a;--accent:#e8bc56;--ink:#172135;--bg:#fafbfc;--radius:18px}
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,Arial,sans-serif}
    a{text-decoration:none;color:inherit}
    header{position:sticky;top:0;z-index:5;background:#fffdddf0;backdrop-filter:saturate(160%) blur(6px);box-shadow:0 2px 8px rgba(16,67,122,.06)}
    header .wrap{display:flex;align-items:center;justify-content:space-between;padding:12px clamp(16px,5vw,48px)}
    header nav ul{display:flex;gap:18px;list-style:none;margin:0;padding:0}
    header nav a{padding:6px 12px;border-radius:999px;color:var(--primary);font-weight:700}
    header nav a[aria-current="page"], header nav a:hover{background:var(--accent);color:#111}

    .hero{display:grid;place-items:center;min-height:38vh;background:linear-gradient(180deg,rgba(16,67,122,.18),rgba(232,188,86,.08)),url('/images/DJI_0441.JPG') center/cover no-repeat}
    .hero .box{background:#ffffffdd;padding:28px 34px;border-radius:var(--radius);text-align:center}
    .hero h1{margin:0;font-family:'Playfair Display',serif;color:var(--primary);font-size:clamp(1.9rem,3.8vw,2.6rem)}

    .page{padding:32px clamp(16px,6vw,64px) 70px}
    .page h2{font-family:'Playfair Display',serif;color:var(--primary);margin:0 0 8px}
    .page p{margin:0 0 22px;color:#2a3a55}

    .crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700;color:#2a3a55;margin:0 0 18px}
    .crumbs a{color:var(--primary)}
    .crumbs .sep{opacity:.5}

    .grid-albums{display:grid;grid-template-columns:repeat(3,1fr);gap:42px 32px}
    @media (max-width:1100px){.grid-albums{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:640px){.grid-albums{grid-template-columns:1fr}}
    .album{display:flex;flex-direction:column;gap:12px}
    .cover{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:#e9eef5;box-shadow:0 4px 22px rgba(0,0,0,.10);transition:transform .25s, box-shadow .25s}
    .cover img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s, transform .35s}
    .album:hover .cover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(16,67,122,.15)}
    .album:hover .cover img{transform:scale(1.02)}
    .caption{text-align:center}
    .title{font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .sub{margin-top:6px;font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;color:#6b778d}

    .grid-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media (max-width:1100px){.grid-photos{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:640px){.grid-photos{grid-template-columns:1fr}}
    .tile{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/2;background:#e9eef5;box-shadow:0 3px 14px rgba(0,0,0,.06)}
    .tile img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s, transform .25s}
    .tile:hover img{transform:scale(1.02)}

    .hidden{display:none!important}
    .empty{opacity:.75;text-align:center;margin:18px 0}
    footer{background:#10233a;color:#f5f5f5;text-align:center;padding:42px 6vw;margin-top:60px;border-radius:18px 18px 0 0}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="index.html" aria-label="ASF Visuals home"><strong>ASF Visuals</strong></a>
      <nav aria-label="Main">
        <ul>
          <li><a href="index.html#top">Home</a></li>
          <li><a href="index.html#portfolio">Portfolio</a></li>
          <li><a href="real-estate.html" aria-current="page">Real Estate</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="box"><h1>Real Estate Portfolio</h1></div>
  </section>

  <main class="page" id="top">
    <h2>Properties</h2>
    <p>Browse by <strong>state</strong> → <strong>city</strong> → <strong>property</strong>. Click any image to open the lightbox.</p>

    <nav class="crumbs" id="crumbs"></nav>
    <button id="backBtn" class="hidden" onclick="goUp()">◀ Back</button>

    <!-- Views -->
    <section id="albums" class="grid-albums" aria-label="Albums"></section>
    <section id="photos" class="grid-photos hidden" aria-label="Photos"></section>
    <p id="empty" class="empty hidden">No results.</p>
  </main>

  <footer>
    <p>&copy; 2025 ASF Visuals LLC. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>
  <script>
    /* ====== CONFIG ====== */
    // 🔧 Change this to where you deploy the JSON file:
    const MANIFEST_PATH = '/data/realestate-manifest.json';

    /* ====== HELPERS ====== */
    const slug = s => (s||'').toString().trim().toLowerCase().replace(/\s+/g,'-');
    const titleize = s => (s||'')
      .toString()
      .replace(/[-_]/g,' ')
      .replace(/\b([a-z])/g, c => c.toUpperCase());

    function pickThumbAndSrc(item){
      const jpg = item?.variants?.jpg || {};
      const avif = item?.variants?.avif || {};
      const widths = (item?.widths || []).slice().sort((a,b)=>a-b);
      const largest = widths[widths.length-1];
      const mid = widths.find(w=>w>=960) || widths[0] || largest;

      const thumb = avif[String(mid)] || jpg[String(mid)] || Object.values(avif)[0] || Object.values(jpg)[0];
      const src   = jpg[String(largest)] || avif[String(largest)] || thumb;
      return { thumb, src, caption: item.alt || '' };
    }

    // Transform manifest (city→state→property) into state→city→property for browsing.
    function buildTree(manifest){
      const tree = new Map(); // state -> Map(city -> Map(property -> photos[]))

      const byCity = manifest.cities || {};
      for (const citySlug in byCity){
        const statesObj = byCity[citySlug] || {};
        for (const stateSlug in statesObj){
          const propsObj = statesObj[stateSlug] || {};
          if (!tree.has(stateSlug)) tree.set(stateSlug, new Map());
          const cityMap = tree.get(stateSlug);
          if (!cityMap.has(citySlug)) cityMap.set(citySlug, new Map());
          const propMap = cityMap.get(citySlug);
          for (const propSlug in propsObj){
            const photosRaw = propsObj[propSlug] || [];
            const photos = photosRaw.map(p => pickThumbAndSrc(p));
            propMap.set(propSlug, photos);
          }
        }
      }
      return tree;
    }

    function parsePath(){
      const h = decodeURIComponent(location.hash.replace(/^#\//,''));
      return h ? h.split('/').filter(Boolean) : [];
    }
    function setPath(parts){ location.hash = '#/' + parts.join('/'); }
    function goUp(){ const parts=parsePath(); parts.pop(); setPath(parts); }

    /* ====== RENDERING ====== */
    const $crumbs = document.getElementById('crumbs');
    const $albums = document.getElementById('albums');
    const $photos = document.getElementById('photos');
    const $empty  = document.getElementById('empty');
    const $back   = document.getElementById('backBtn');

    function lazy(img){
      const obs = new IntersectionObserver((entries,o)=>{
        entries.forEach(e=>{
          if (!e.isIntersecting) return;
          const el = e.target;
          el.src = el.dataset.src;
          el.onload = ()=> el.style.opacity = 1;
          o.unobserve(el);
        });
      },{threshold:.15});
      obs.observe(img);
    }

    function renderCrumbs(parts){
      const frag = document.createDocumentFragment();
      const link = (label, toParts) => {
        const a = document.createElement('a');
        a.href = '#/' + toParts.join('/');
        a.textContent = label;
        a.addEventListener('click', e=>{ e.preventDefault(); setPath(toParts); });
        return a;
      };
      frag.appendChild(link('All Properties', []));
      if (parts[0]){ frag.appendChild(Object.assign(document.createElement('span'),{className:'sep',textContent:'›'})); frag.appendChild(link(titleize(parts[0]), [parts[0]])); }
      if (parts[1]){ frag.appendChild(Object.assign(document.createElement('span'),{className:'sep',textContent:'›'})); frag.appendChild(link(titleize(parts[1]), [parts[0], parts[1]])); }
      if (parts[2]){ frag.appendChild(Object.assign(document.createElement('span'),{className:'sep',textContent:'›'})); frag.appendChild(link(titleize(parts[2]), [parts[0], parts[1], parts[2]])); }
      $crumbs.innerHTML = ''; $crumbs.appendChild(frag);
      $back.classList.toggle('hidden', parts.length === 0);
    }

    function renderAlbums(nodes){
      $photos.classList.add('hidden');
      $albums.classList.remove('hidden');
      $albums.innerHTML = '';
      $empty.classList.toggle('hidden', nodes.length !== 0);

      nodes.forEach(n=>{
        const card = document.createElement('a');
        card.href = '#';
        card.className = 'album';
        card.addEventListener('click', e=>{
          e.preventDefault();
          const parts = parsePath();
          parts.push(n.id);
          setPath(parts);
        });

        const cover = document.createElement('div'); cover.className='cover';
        const img = document.createElement('img'); img.alt = n.label; img.dataset.src = n.cover || '/images/social-preview.jpg';
        cover.appendChild(img);

        const cap = document.createElement('div'); cap.className='caption';
        const title = Object.assign(document.createElement('div'), {className:'title', textContent:n.label});
        const sub   = Object.assign(document.createElement('div'), {className:'sub', textContent:n.sub});
        cap.appendChild(title); cap.appendChild(sub);

        card.appendChild(cover); card.appendChild(cap);
        $albums.appendChild(card);
        lazy(img);
      });
    }

    function renderPhotos(propNode){
      $albums.classList.add('hidden');
      $photos.classList.remove('hidden');
      $photos.innerHTML = '';
      const photos = propNode.photos || [];
      $empty.classList.toggle('hidden', photos.length !== 0);

      photos.forEach(p=>{
        const a = document.createElement('a');
        a.href = p.src;
        a.setAttribute('data-fancybox', propNode.label);
        if (p.caption) a.setAttribute('data-caption', p.caption);

        const t = document.createElement('div'); t.className='tile';
        const img = document.createElement('img'); img.alt = p.caption || propNode.label; img.dataset.src = p.thumb || p.src;
        t.appendChild(img); a.appendChild(t); $photos.appendChild(a);
        lazy(img);
      });
    }

    /* ====== APP ====== */
    let TREE = null; // Map(state -> Map(city -> Map(property -> photos[])))

    function getNode(parts){
      if (!TREE) return null;
      if (parts.length === 0){
        // root: list states
        return {
          kind:'root',
          children: Array.from(TREE.keys()).sort().map(state=>{
            const cities = TREE.get(state);
            // cover: first property's first photo
            const firstCity = cities.keys().next().value;
            const firstProp = cities.get(firstCity).keys().next().value;
            const cover = cities.get(firstCity).get(firstProp)?.[0]?.thumb;
            return { id: state, label: titleize(state), cover, sub: `${cities.size} CITIES` };
          })
        };
      }
      const state = parts[0];
      const cities = TREE.get(state);
      if (!cities) return null;

      if (parts.length === 1){
        return {
          kind:'state',
          label:titleize(state),
          children: Array.from(cities.keys()).sort().map(city=>{
            const props = cities.get(city);
            const firstProp = props.keys().next().value;
            const cover = props.get(firstProp)?.[0]?.thumb;
            return { id: city, label: titleize(city), cover, sub: `${props.size} PROPERTIES` };
          })
        };
      }
      const city = parts[1];
      const props = cities.get(city);
      if (!props) return null;

      if (parts.length === 2){
        return {
          kind:'city',
          label:titleize(city),
          children: Array.from(props.keys()).sort().map(prop=>{
            const photos = props.get(prop) || [];
            const cover = photos[0]?.thumb;
            return { id: prop, label: titleize(prop), cover, sub: `${photos.length} PHOTOS` };
          })
        };
      }
      const prop = parts[2];
      const photos = (props.get(prop) || []);
      return { kind:'property', label:titleize(prop), photos };
    }

    function render(){
      const parts = parsePath();
      renderCrumbs(parts);
      const node = getNode(parts);
      if (!node){ setPath([]); return; }

      if (node.kind === 'property') renderPhotos(node);
      else renderAlbums(node.children);
    }

    (async function init(){
      try{
        const res = await fetch(MANIFEST_PATH, { cache:'no-cache' });
        if (!res.ok) throw new Error('Manifest not found at ' + MANIFEST_PATH);
        const manifest = await res.json();
        TREE = buildTree(manifest);

        // route
        addEventListener('hashchange', render);
        render();
      }catch(err){
        console.error(err);
        document.getElementById('empty').classList.remove('hidden');
        document.getElementById('empty').textContent = 'Could not load image manifest.';
      }
    })();
  </script>
</body>
</html>
